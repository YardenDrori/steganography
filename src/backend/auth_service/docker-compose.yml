services:
  auth_postgres:
    image: postgres:16-alpine
    container_name: auth_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auth_network

  auth_service:
    build:
      context: ..
      dockerfile: auth_service/Dockerfile
    container_name: auth_service
    environment:
      DATABASE_URL: postgres://postgres:postgres@auth_postgres:5432/auth_db
      EUREKA_URL: http://eureka_service:3005
      RUST_LOG: info
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      auth_postgres:
        condition: service_healthy
      eureka_service:
        condition: service_healthy
    networks:
      - auth_network

volumes:
  auth_postgres_data:

networks:
  auth_network:
    driver: bridge
    name: microservices_network
    external: true
